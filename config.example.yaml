# rssmart configuration — copy to config.yaml (gitignored) and edit.

# SQLite database; relative paths resolve against this file's directory.
db: ./data/rssmart.db

ollama:
  url: http://localhost:11434   # your network-local Ollama instance
  chatModel: llama3.1           # any instruct model, for topics + summaries
  embedModel: qwen3-embedding:0.6b  # embeddings: dedup, taste, (search)
  # Changing embedModel (or embedDimensions below) is safe: the change is
  # detected on the next run, stored vectors are cleared and articles are
  # re-embedded automatically.
  # Retrieval models use task prefixes; set them per your model's card
  # (qwen3: plain documents, instructed queries; nomic v1.5 would want
  # document: "search_document: " and query: "search_query: ").
  # embedDimensions: 512  # optional Matryoshka truncation — halves storage
                          # on top of float16, little accuracy loss, only
                          # if your model supports it (qwen3-embedding does;
                          # check any other model's card before assuming)
  embedPrefixes:
    document: ""
    query: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
  timeoutMs: 60000

enrich:
  workers: 2          # concurrent articles in the LLM pipeline; raising this
                      # only helps if the Ollama server accepts parallel
                      # requests (OLLAMA_NUM_PARALLEL)
  maxAttempts: 5      # failed classifications before an article is parked
  dupThreshold: 0.87  # cosine similarity above which a story is a repeat
  dupWindowDays: 14   # how far back to look for repeats
  fetchMinChars: 500  # if the RSS entry has less text than this, fetch the
                      # article's own page for the real content (0 = never)
  allowPrivateFetch: false  # SSRF guard: article links resolving to private/
                            # LAN addresses are not fetched; enable only if
                            # you subscribe to intranet feeds you trust
  maxInputChars: 32000  # how much article text the LLM reads for topics and
                        # the preview (longer articles keep head + tail).
                        # Reading is fast — 32k costs ~25% more time than 8k —
                        # but very large values degrade small models'
                        # instruction-following before they cost time
  maxArticleChars: 50000  # hard cap on a fetched origin page's stored text/
                          # html, no matter how well it extracted — a safety
                          # net against pages that aren't really one article
                          # (e.g. an anchor into a shared listing/archive page)

cron:
  maxRunMs: 300000    # time budget per cron run; unfinished classification
                      # work simply continues on the next run

scheduler:
  enabled: true       # serve mode runs everything itself: fetches feeds when
                      # they're due and classifies pending articles — no
                      # system cron needed
  minIntervalMin: 15  # bounds for the adaptive per-feed fetch cadence
  maxIntervalMin: 1440  # (a feed is checked about as often as it publishes)

# An article's interest score blends four signals, each -1..+1 and neutral
# when it has no data yet. Weights need not sum to 1.
scoring:
  knn: 20             # how many similar voted articles the embedding signal uses
  weights:
    topics: 0.4       # votes on the article's topics
    embedding: 0.3    # votes on articles with similar text (style/genre taste)
    depth: 0.2        # LLM substance rating: rewards real reporting/analysis
    feed: 0.1         # the source's own vote record
  recomputeDebounceSec: 120  # a vote updates its own article's score instantly;
                             # rescoring every *other* article (the vote can
                             # shift anyone's kNN term) is expensive at scale,
                             # so it's debounced this many seconds after your
                             # last vote — raise it if you tend to vote in
                             # long sessions and don't need scores to settle
                             # between them

server:
  host: 0.0.0.0
  port: 8098

# Feeds are managed from the web UI (Feeds tab: add, enable/disable, OPML
# import/export). An optional "feeds:" list of URLs here is seeded into the
# database on each cron run, but is not required.

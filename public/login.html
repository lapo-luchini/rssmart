<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rssmart — log in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#128225;</text></svg>">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0;
    background: #fbfaf7; color: #20242b;
  }
  @media (prefers-color-scheme: dark) { body { background: #1b1d21; color: #e8e6e2; } }
  form { display: flex; flex-direction: column; gap: 0.75rem; width: min(320px, 90vw); }
  h1 { font-size: 1.2rem; margin: 0 0 0.5rem; }
  input {
    font-size: 1rem; padding: 0.6rem; border-radius: 6px;
    border: 1px solid #6e7681; background: transparent; color: inherit;
  }
  button {
    font-size: 1rem; padding: 0.6rem; border-radius: 6px; border: none;
    background: #20242b; color: #fbfaf7; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { background: #e8e6e2; color: #1b1d21; } }
  p.error { color: #b5432f; margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>📡 rssmart</h1>
  <input type="password" name="password" placeholder="password" autofocus autocomplete="current-password" required>
  <button type="submit">log in</button>
  <p class="error" id="error" hidden>wrong password</p>
</form>
<script>
  if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('error').hidden = false;
  }
</script>
</body>
</html>
